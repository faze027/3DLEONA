<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Leona</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Layout: one full-bleed studio stage; a slim caption bar on top, a control dock at the bottom. */
  :root {
    --stage: #e8e3db; --stage-2: #d6cfc4; --ink: #1f1c20; --muted: #6a625a;
    --line: rgba(31, 28, 32, 0.14); --chip: rgba(31, 28, 32, 0.05); --chip-on: #1f1c20; --chip-on-ink: #f3eee6;
    --accent: #8b6a2e; --shadow: rgba(0, 0, 0, 0.35);
    --f-display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
    --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --f-data: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --stage: #1b191d; --stage-2: #0f0e11; --ink: #eee8de; --muted: #a59d92;
      --line: rgba(238, 232, 222, 0.13); --chip: rgba(238, 232, 222, 0.06); --chip-on: #eee8de; --chip-on-ink: #1b191d;
      --accent: #cfa968; --shadow: rgba(0, 0, 0, 0.55); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --stage: #1b191d; --stage-2: #0f0e11; --ink: #eee8de; --muted: #a59d92;
    --line: rgba(238, 232, 222, 0.13); --chip: rgba(238, 232, 222, 0.06); --chip-on: #eee8de; --chip-on-ink: #1b191d;
    --accent: #cfa968; --shadow: rgba(0, 0, 0, 0.55); color-scheme: dark;
  }
  html, body { height: 100%; }
  html { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(120% 90% at 50% 38%, var(--stage) 0%, var(--stage-2) 100%);
    background-color: var(--stage);
    color: var(--ink); font-family: var(--f-body); overflow: hidden;
  }
  .app { position: relative; height: 100%; display: flex; flex-direction: column; }
  #stage { position: absolute; inset: 0; touch-action: none; }
  #stage canvas { display: block; width: 100%; height: 100%; outline: none; }

  header.bar {
    position: relative; z-index: 2; display: flex; gap: 12px 28px; align-items: flex-end; flex-wrap: wrap;
    padding-block: 18px 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    pointer-events: none;
  }
  .title { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(30px, 4.2vw, 44px); line-height: 1; margin: 0; letter-spacing: 0.005em; text-wrap: balance; }
  .sub { font-size: 13px; color: var(--muted); }
  .stats { display: flex; gap: 6px 18px; flex-wrap: wrap; font-family: var(--f-data); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stats b { color: var(--ink); font-weight: 500; }
  .legend { margin-left: auto; display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; box-shadow: inset 0 0 0 1px var(--line); }

  .dock {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
    padding-block: 10px calc(14px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; gap: 10px 22px; flex-wrap: wrap; align-items: center; justify-content: center;
  }
  .group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .label { font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
  button.chip {
    font: 500 13px/1 var(--f-body); color: var(--ink); background: var(--chip);
    border: 1px solid var(--line); border-radius: 999px; padding: 8px 13px; cursor: pointer;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: background .15s, color .15s;
  }
  button.chip:hover { border-color: var(--muted); }
  button.chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
  button.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .loader { position: absolute; inset: 0; z-index: 3; display: grid; place-items: center; pointer-events: none; transition: opacity .5s; }
  .loader .box { display: flex; flex-direction: column; gap: 10px; align-items: center; font-family: var(--f-data); font-size: 12px; color: var(--muted); text-align: center; padding: 0 16px; }
  .track { width: min(260px, 60vw); height: 2px; background: var(--line); overflow: hidden; border-radius: 2px; }
  .fill { height: 100%; width: 0%; background: var(--accent); transition: width .2s; }
  .loader.done { opacity: 0; }
  .hint { position: absolute; z-index: 2; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(64px + env(safe-area-inset-bottom, 0px)); font-size: 11.5px; color: var(--muted); pointer-events: none; }
  @media (max-width: 720px) {
    .legend { display: none; }
    .hint { display: none; }
    .dock { gap: 8px 14px; }
    button.chip { padding: 7px 11px; font-size: 12.5px; }
    .label { display: none; }
  }
  select.chip { appearance: none; font: 500 13px/1 var(--f-body); color: var(--ink); background: var(--chip); border: 1px solid var(--line); border-radius: 999px; padding: 8px 13px; cursor: pointer; }
  select.chip option { color: #1f1c20; background: #fff; }
</style>
</head>
<body>
<div class="app">
  <div id="stage" aria-label="3D view of the textured model. Drag to orbit, scroll or pinch to zoom."></div>
  <header class="bar">
    <div class="title">
      <h1>Leona</h1>
      <div class="sub">3D model collection</div>
    </div>
    <div class="stats" aria-label="Model facts"><span id="facts">Loading…</span></div>
  </header>

  <div class="loader" id="loader"><div class="box"><div class="track"><div class="fill" id="fill"></div></div><div id="ltext">Loading model&hellip;</div></div></div>
  <div class="hint">Drag to orbit &middot; scroll to zoom &middot; right-drag to pan</div>

  <nav class="dock" aria-label="Viewer controls">
    <div class="group" role="group" aria-label="Model">
      <span class="label">Model</span>
      <select class="chip" id="modelSelect" aria-label="Choose a model">
        <option value="model_colored.glb">Model Colored</option>
        <option value="model.glb">Model</option>
        <option value="statue_colored.glb">Statue Colored</option>
        <option value="statue.glb">Statue</option>
      </select>
    </div>
    <div class="group" role="group" aria-label="View" id="viewGroup">
      <span class="label">View</span>
      <button class="chip" data-view="full" aria-pressed="true">Full</button>
      <button class="chip" data-view="face" aria-pressed="false">Face</button>
      <button class="chip" data-view="eyes" aria-pressed="false">Eyes</button>
      <button class="chip" data-view="hair" aria-pressed="false">Hair</button>
      <button class="chip" data-view="outfit" aria-pressed="false">Outfit</button>
      <button class="chip" data-view="boots" aria-pressed="false">Boots</button>
    </div>
    <div class="group" role="group" aria-label="Lighting">
      <span class="label">Light</span>
      <button class="chip" data-light="studio" aria-pressed="true">Studio</button>
      <button class="chip" data-light="paris" aria-pressed="false">Paris night</button>
      <button class="chip" data-light="day" aria-pressed="false">Daylight</button>
    </div>
    <div class="group" role="group" aria-label="Display">
      <button class="chip" id="t-rotate" aria-pressed="false">Rotate</button>
      <button class="chip" id="t-shadow" aria-pressed="true">Shadows</button>
      <button class="chip" id="t-clay" aria-pressed="false">Bare mesh</button>
    </div>
  </nav>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// Textures decode through <img> elements instead of fetch()+createImageBitmap, which a locked-down frame can refuse.
try { window.createImageBitmap = undefined; } catch (e) { /* keep the default loader */ }

const stage = document.getElementById('stage');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse = window.matchMedia('(pointer: coarse)').matches;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// glTF frame: Y up, the figure faces +X, her right hand toward +Z, 0.979 units tall, centred on the origin.
const FLOOR_Y = -0.4897;
const PENUMBRA = 0.0028;          // ~5 mm soft shadow edge, like a large soft box
const camera = new THREE.PerspectiveCamera(30, 1, 0.005, 30);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 0.07; controls.maxDistance = 6;
controls.autoRotateSpeed = 0.8;

// lights: the key light carries the shadow; its shadow box follows the orbit target and tightens as you zoom in
const key = new THREE.DirectionalLight(0xffffff, 2.5);
key.castShadow = true;
const SHADOW_RES = coarse ? 2048 : 4096;
key.shadow.mapSize.set(SHADOW_RES, SHADOW_RES);
key.shadow.camera.near = 0.2; key.shadow.camera.far = 9;
key.shadow.radius = 6; key.shadow.blurSamples = 16;
const rim = new THREE.DirectionalLight(0xffffff, 1.2);
const fill = new THREE.DirectionalLight(0xffffff, 0.4);
const keyTarget = new THREE.Object3D();
scene.add(keyTarget); key.target = keyTarget; rim.target = keyTarget; fill.target = keyTarget;
scene.add(key, rim, fill);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), new THREE.ShadowMaterial({ opacity: 0.26 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = FLOOR_Y - 0.0006; ground.receiveShadow = true;
scene.add(ground);

// directions are [front (+X), up (+Y), her right (+Z)]
const LIGHTS = {
  // portrait lighting: key high and ~45 degrees to her left (from her right the long side of the hair shades the face),
  // a weak fill from her right and a cool rim from behind; the environment stays low so the forms read
  studio: { exposure: 1.0, env: 0.38, key: [0xfff1e4, 3.0, [0.62, 0.50, -0.60]], rim: [0xe2ebff, 1.6, [-0.5, 0.45, 0.55]], fill: [0xffffff, 0.30, [0.5, 0.1, 0.6]] },
  paris:  { exposure: 1.05, env: 0.22, key: [0xffae5c, 3.4, [0.62, 0.22, -0.62]], rim: [0x7d9cff, 2.2, [-0.4, 0.5, 0.55]], fill: [0xffd7a1, 0.30, [0.5, 0.05, 0.55]] },
  day:    { exposure: 1.0, env: 0.85, key: [0xfff9f0, 2.6, [0.5, 0.82, -0.35]], rim: [0xffffff, 0.9, [-0.55, 0.5, 0.4]], fill: [0xdfe9ff, 0.40, [0.5, 0.2, 0.5]] },
};
let lightName = 'studio';
function placeLights() {
  const p = LIGHTS[lightName], t = controls.target;
  keyTarget.position.copy(t);
  for (const [l, d] of [[key, p.key], [rim, p.rim], [fill, p.fill]]) {
    const v = new THREE.Vector3(...d[2]).normalize().multiplyScalar(4);
    l.position.copy(t).add(v);
  }
  // shadow box: tight around the view for crisp face shadows, wide enough for the whole figure when zoomed out
  const dist = camera.position.distanceTo(t);
  const half = THREE.MathUtils.clamp(dist * 0.42, 0.09, 0.66);
  const sc = key.shadow.camera;
  if (Math.abs(sc.right - half) > 1e-4) {
    sc.left = -half; sc.right = half; sc.top = half; sc.bottom = -half; sc.updateProjectionMatrix();
    const texel = 2 * half / SHADOW_RES;
    key.shadow.bias = -0.0004; key.shadow.normalBias = 1.5 * texel;
    key.shadow.radius = THREE.MathUtils.clamp(PENUMBRA / texel, 2, 24);
  }
}
function setLight(name) {
  lightName = name;
  const p = LIGHTS[name];
  renderer.toneMappingExposure = p.exposure;
  scene.environmentIntensity = p.env;
  for (const [l, d] of [[key, p.key], [rim, p.rim], [fill, p.fill]]) { l.color.setHex(d[0]); l.intensity = d[1]; }
  placeLights();
  document.querySelectorAll('[data-light]').forEach(b => b.setAttribute('aria-pressed', b.dataset.light === name));
}

// camera presets (glTF units; the figure looks toward +X)
const VIEWS = {
  full:   { pos: [2.05, 0.16, 0.62], tgt: [0, -0.02, 0] },
  face:   { pos: [0.43, 0.425, 0.13], tgt: [0.06, 0.397, 0.0] },
  eyes:   { pos: [0.225, 0.418, 0.036], tgt: [0.066, 0.414, -0.001] },
  hair:   { pos: [-0.56, 0.52, -0.38], tgt: [-0.005, 0.37, 0.0] },
  outfit: { pos: [1.18, 0.02, 0.70], tgt: [0.0, -0.07, 0.0] },
  boots:  { pos: [0.72, -0.24, 0.45], tgt: [0.03, -0.39, 0.0] },
};
let tween = null;
function setView(name, instant = false) {
  const v = VIEWS[name];
  const p1 = new THREE.Vector3(...v.pos), t1 = new THREE.Vector3(...v.tgt);
  if (instant || reduceMotion) { camera.position.copy(p1); controls.target.copy(t1); controls.update(); tween = null; placeLights(); }
  else tween = { p0: camera.position.clone(), t0: controls.target.clone(), p1, t1, t: 0 };
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === name));
}

// Skin: light wraps a little past the terminator, red furthest, the way it scatters under real skin.
// Hair: the anisotropy direction map is decoded with a guarded normalize (mip-averaged texels can be ~zero).
const SKIN = new Set(['Skin_Face_Lips', 'Skin_Hands', 'Eyes_Lashes_Brows']);
function patchMaterial(mat) {
  const skin = SKIN.has(mat.name), aniso = !!mat.anisotropyMap;
  if (!skin && !aniso) return;
  mat.onBeforeCompile = (shader) => {
    if (skin) shader.fragmentShader = shader.fragmentShader.replace('#include <lights_physical_pars_fragment>',
      THREE.ShaderChunk.lights_physical_pars_fragment.replace(
        'reflectedLight.directDiffuse += irradiance * BRDF_Lambert( material.diffuseColor );',
        'float nlW = dot( geometryNormal, directLight.direction );\n' +
        'vec3 wrapW = vec3( 0.40, 0.17, 0.11 );\n' +
        'vec3 dlW = saturate( ( vec3( nlW ) + wrapW ) / ( 1.0 + wrapW ) );\n' +
        'reflectedLight.directDiffuse += dlW * directLight.color * BRDF_Lambert( material.diffuseColor );'));
    if (aniso) shader.fragmentShader = shader.fragmentShader.replace('#include <lights_physical_fragment>',
      THREE.ShaderChunk.lights_physical_fragment.replace(
        'normalize( 2.0 * anisotropyPolar.rg - vec2( 1.0 ) )',
        '( ( 2.0 * anisotropyPolar.rg - vec2( 1.0 ) ) / max( length( 2.0 * anisotropyPolar.rg - vec2( 1.0 ) ), 1e-3 ) )'));
  };
  mat.customProgramCacheKey = () => (skin ? 'skin-wrap' : '') + (aniso ? 'aniso-safe' : '');
  mat.needsUpdate = true;
}

let model = null, clay = false;
const original = new Map();
const clayMat = new THREE.MeshStandardMaterial({ color: 0xc9c2b8, roughness: 0.72, metalness: 0 });
function setClay(on) {
  clay = on;
  if (model) model.traverse(o => {
    if (!o.isMesh) return;
    if (o.userData.isLash) o.visible = !on;          // the 3D lashes are an added object, not part of the uploaded mesh
    else o.material = on ? clayMat : original.get(o);
  });
  document.getElementById('t-clay').setAttribute('aria-pressed', on);
}
function setShadows(on) {
  key.castShadow = on; ground.visible = on;
  document.getElementById('t-shadow').setAttribute('aria-pressed', on);
}
function setRotate(on) {
  controls.autoRotate = on;
  document.getElementById('t-rotate').setAttribute('aria-pressed', on);
}

const fillEl = document.getElementById('fill'), ltext = document.getElementById('ltext');
const setProgress = (f, text) => { fillEl.style.width = (100 * Math.min(1, f)).toFixed(0) + '%'; ltext.textContent = text; };
let resolveReady; const ready = new Promise(r => (resolveReady = r));

// Each model is one .glb file next to this page. Whatever its size or orientation, it is turned to face +X,
// scaled to the same height and centred, so the lights, shadows and camera presets fit every model.
const MODELS = {
  'model_colored.glb':  { yaw: 0, closeups: true },
  'model.glb':          { yaw: 0, closeups: true },
  'statue_colored.glb': { yaw: Math.PI / 2, closeups: false },
  'statue.glb':         { yaw: Math.PI / 2, closeups: false },
};
const HEIGHT = 0.9793;
let loadId = 0;
async function fetchGlb(url, id) {
  const res = await fetch(encodeURI(url));
  if (!res.ok) throw new Error(url + ': HTTP ' + res.status);
  const total = Number(res.headers.get('content-length')) || 0;
  if (!res.body) return res.arrayBuffer();
  const reader = res.body.getReader(); const chunks = []; let got = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value); got += value.length;
    if (id === loadId) setProgress(total ? 0.95 * got / total : 0.4, `Loading model… ${(got / 1048576).toFixed(0)}${total ? ' of ' + (total / 1048576).toFixed(0) : ''} MB`);
  }
  const all = new Uint8Array(got); let o = 0; for (const c of chunks) { all.set(c, o); o += c.length; }
  return all.buffer;
}
function disposeModel(root) {
  root.traverse(o => {
    if (!o.isMesh) return;
    o.geometry.dispose();
    const m = original.get(o) || o.material;
    for (const v of Object.values(m)) if (v && v.isTexture) v.dispose();
    m.dispose();
  });
  scene.remove(root);
}
async function loadModel(file) {
  const id = ++loadId, cfg = MODELS[file] || { yaw: 0, closeups: false };
  const loaderEl = document.getElementById('loader');
  loaderEl.classList.remove('done'); setProgress(0, 'Loading model…');
  try {
    const buf = await fetchGlb(file, id);
    if (id !== loadId) return;
    const gltf = await new Promise((resolve, reject) => new GLTFLoader().parse(buf, './', resolve, reject));
    if (id !== loadId) return;
    if (model) disposeModel(model);
    original.clear();
    const inner = gltf.scene; inner.rotation.y = cfg.yaw; inner.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(inner), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
    const k = HEIGHT / size.y;
    model = new THREE.Group(); model.add(inner);
    model.scale.setScalar(k); model.position.set(-c.x * k, -c.y * k, -c.z * k);
    const aniso = renderer.capabilities.getMaxAnisotropy();
    let tris = 0;
    model.traverse(o => {
      if (!o.isMesh) return;
      tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3;
      o.userData.isLash = !!o.material && o.material.name === 'Eyelashes';
      o.castShadow = !o.userData.isLash; o.receiveShadow = true; original.set(o, o.material);
      const m = o.material;
      for (const key of ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'aoMap', 'anisotropyMap']) if (m[key]) m[key].anisotropy = aniso;
      if (!m.userData.patched) { m.userData.patched = true; patchMaterial(m); }
    });
    scene.add(model);
    document.getElementById('facts').innerHTML = `<b>${Math.round(tris).toLocaleString()}</b> triangles · <b>${(buf.byteLength / 1048576).toFixed(0)}</b> MB`;
    document.querySelectorAll('[data-view]').forEach(b => { b.hidden = !cfg.closeups && b.dataset.view !== 'full'; });
    setClay(false); setView('full', true);
    loaderEl.classList.add('done');
    resolveReady(true);
  } catch (err) {
    if (id !== loadId) return;
    ltext.textContent = `Could not load "${file}". Check that it is in the same folder as index.html and the name matches exactly.`;
    console.error(err);
  }
}
document.getElementById('modelSelect').addEventListener('change', e => loadModel(e.target.value));

document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
document.querySelectorAll('[data-light]').forEach(b => b.addEventListener('click', () => setLight(b.dataset.light)));
document.getElementById('t-clay').addEventListener('click', () => setClay(!clay));
document.getElementById('t-shadow').addEventListener('click', () => setShadows(!key.castShadow));
document.getElementById('t-rotate').addEventListener('click', () => setRotate(!controls.autoRotate));
controls.addEventListener('start', () => { tween = null; });
controls.addEventListener('change', placeLights);

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.fov = w / h < 0.6 ? 50 : (w / h < 0.9 ? 40 : 30); camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize(); setView('full', true); setLight('studio');
loadModel(document.getElementById('modelSelect').value);

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (tween) {
    tween.t = Math.min(1, tween.t + dt / 0.9);
    const k = tween.t < 0.5 ? 4 * tween.t ** 3 : 1 - (-2 * tween.t + 2) ** 3 / 2;
    camera.position.lerpVectors(tween.p0, tween.p1, k); controls.target.lerpVectors(tween.t0, tween.t1, k);
    if (tween.t >= 1) tween = null;
